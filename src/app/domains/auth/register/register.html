<h2>Crear cuenta</h2>

@if (errorMessage()) {
  <div class="error-message">{{ errorMessage() }}</div>
}

<form class="register-form" (submit)="onSubmit($event)">
  <label>
    Email
    <input
      [value]="registerForm().email"
      (input)="updateField('email', $any($event.target).value)"
      type="email"
      required
      placeholder="ej: juan@mail.com"
      autocomplete="email"
    />
  </label>

  <label>
    Contraseña
    <input
      [value]="registerForm().password"
      (input)="updateField('password', $any($event.target).value)"
      type="password"
      required
      placeholder="Mínimo 8 caracteres"
      autocomplete="new-password"
    />
  </label>

  <button class="submit-btn" type="submit" [disabled]="loading()">
    @if (loading()) {
      Creando cuenta...
    } @else {
      Registrarme
    }
  </button>
</form>

<p class="login-link">¿Ya tenés cuenta? <a routerLink="/login">Iniciar sesión</a></p>
