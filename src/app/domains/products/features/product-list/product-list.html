<div class="products-page">
  <h1 class="products-page__title">Nuestros productos</h1>

  <div class="product-grid">
    @for (product of products(); track product.id) {
      <a [routerLink]="['/products', product.slug]" class="product-card">
        <div class="product-card__image">
          <img [src]="product.image" [alt]="product.name" />
        </div>

        <div class="product-card__body">
          <span class="product-card__brand">{{ product.brand }}</span>
          <h3 class="product-card__name">{{ product.name }}</h3>
          <span class="product-card__category">{{ product.category_display }}</span>
        </div>

        <div class="product-card__footer">
          <app-price-display
            style="--price-font-size: 1.2rem; --price-font-size-old: 1rem"
            [price]="product.price"
            [vipPrice]="product.vip_price"
          />
        </div>
      </a>
    } @empty {
      <div class="empty-state">
        <p>No hay productos disponibles</p>
      </div>
    }
  </div>
</div>
