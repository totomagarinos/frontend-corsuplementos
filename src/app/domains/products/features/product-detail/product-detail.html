<div class="product-detail">
  @if (product(); as product) {
    <div class="product-detail__gallery">
      <img [src]="product.image" [alt]="product.name" />
    </div>

    <div class="product-detail__info">
      <span class="product-detail__brand">{{ product.brand }}</span>
      <h1 class="product-detail__name">{{ product.name }}</h1>
      <span class="product-detail__price">${{ product.base_price }}</span>
      <p class="product-detail__description">{{ product.description }}</p>

      <div class="variant-selector">
        <span class="variant-selector__label">Elegí una opción</span>
        <div class="variant-selector__options">
          @for (variant of product.variants; track variant.id) {
            <button
              type="button"
              class="variant-option"
              [class.selected]="selectedVariant()?.id === variant.id"
              (click)="selectVariant(variant)"
            >
              {{ variant.size }} / {{ variant.flavor }}
            </button>
          }
        </div>
      </div>

      <div class="quantity-selector">
        <span class="quantity-selector__label">Cantidad</span>
        <div class="quantity-selector__controls">
          <button
            type="button"
            class="qty-btn"
            (click)="updateQuantity(quantity() - 1)"
            aria-label="Restar cantidad"
          >
            −
          </button>
          <input
            class="qty-input"
            type="number"
            min="1"
            [value]="quantity()"
            (input)="quantity.set(+$any($event.target).value)"
          />
          <button
            type="button"
            class="qty-btn"
            (click)="updateQuantity(quantity() + 1)"
            aria-label="Sumar cantidad"
          >
            +
          </button>
        </div>
      </div>

      <button class="add-to-cart-btn" (click)="addToCart()" [disabled]="!selectedVariant()">
        Agregar al carrito
      </button>
    </div>
  } @else {
    <div class="product-detail__loading">
      <p>Cargando...</p>
    </div>
  }
</div>
