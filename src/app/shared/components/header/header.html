<header class="header">
  <a class="brand" routerLink="/">
    <img src="/cs_logo.png" alt="CorSuplementos" class="brand-logo" />
  </a>

  <div class="input-container">
    <input
      class="search-input"
      type="text"
      (input)="onSearchInput($event)"
      placeholder="Buscar productos..."
    />
  </div>

  <div class="header-actions">
    <div class="main-nav">
      <a class="nav-link" routerLink="/cart">
        Carrito
        @if (cartService.itemsCount() > 0) {
          <span class="badge">{{ cartService.itemsCount() }}</span>
        }
      </a>
    </div>

    <div class="user-menu">
      @if (authService.isAuthenticated()) {
        <button class="user-menu__trigger" (click)="toggleMenu()">
          <span>
            {{ authService.currentUser()?.first_name }}
          </span>
          <span class="material-symbols-outlined"> keyboard_arrow_down </span>
        </button>

        @if (isOpen) {
          <div class="user-menu__dropdown">
            <a routerLink="/my-orders" (click)="closeMenu()">Mis pedidos</a>
            <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
          </div>
        }
      } @else {
        <a class="login-btn" routerLink="/login">Iniciar sesión</a>
      }
    </div>
  </div>
</header>
