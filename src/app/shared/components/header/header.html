<header class="header">
  <a class="brand" routerLink="/">Corsuplementos</a>

  <nav class="main-nav">
    <a class="nav-link" routerLink="/cart">
      Carrito
      @if (cartService.itemsCount() > 0) {
        <span class="badge">{{ cartService.itemsCount() }}</span>
      }
    </a>
  </nav>

  <nav class="auth-nav">
    @if (authService.isAuthenticated()) {
      <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
    } @else {
      <a class="nav-link" routerLink="/login">Iniciar sesión</a>
    }
  </nav>
</header>
